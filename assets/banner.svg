<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #10b981;
      letter-spacing: 0.5px;
    }
    .glow-line {
      fill: none;
      stroke: url(#primaryGrad);
      stroke-width: 2.5;
      stroke-dasharray: 800;
      animation: draw 6s ease-in-out infinite alternate;
    }
    .wave-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .floating-card-1 {
      animation: floatA 5s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatB 6s ease-in-out infinite alternate;
    }
    .floating-pill {
      animation: floatPill 4.5s ease-in-out infinite alternate;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 800; opacity: 0.4; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: translateY(0px); }
      100% { opacity: 0.7; transform: translateY(-8px); }
    }
    @keyframes floatA {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes floatB {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px) scale(0.98); }
      100% { transform: translateY(-6px) scale(1.02); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Subtle Animated Wave in Background Layer -->
  <g class="wave-pulse" opacity="0.35">
    <path d="M 0 310 Q 300 240, 600 280 T 1200 220 L 1200 360 L 0 360 Z" fill="rgba(16, 185, 129, 0.08)" />
    <path d="M 0 330 Q 350 270, 750 310 T 1200 280 L 1200 360 L 0 360 Z" fill="rgba(6, 182, 212, 0.06)" />
  </g>

  <!-- Animated Glowing Yield Line (Behind Right Widgets) -->
  <g filter="url(#glow)">
    <path class="glow-line" d="M 550 270 C 680 260, 740 210, 830 190 C 920 170, 980 120, 1140 100" />
  </g>

  <!-- Dynamic Graphic Elements on the Right Side (Behind text safely) -->
  <g class="floating-card-1" transform="translate(860, 60)">
    <!-- Glassmorphism Card 1 -->
    <rect width="280" height="110" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <circle cx="28" cy="35" r="14" fill="rgba(16, 185, 129, 0.2)" />
    <path d="M 23 37 L 27 32 L 30 35 L 34 29" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Idle Balance Swept</text>
    <text x="52" y="47" font-family="-apple-system, sans-serif" font-weight="400" font-size="10" fill="#64748b">Automated MMF &amp; T-Bills</text>
    <text x="28" y="85" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" fill="#38bdf8">$12,480,000</text>
    <rect x="180" y="70" width="82" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" />
    <text x="221" y="85" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="middle">+5.24% APY</text>
  </g>

  <g class="floating-card-2" transform="translate(790, 195)">
    <!-- Glassmorphism Card 2 -->
    <rect width="290" height="95" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <circle cx="28" cy="32" r="14" fill="rgba(59, 130, 246, 0.2)" />
    <text x="24" y="37" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" fill="#60a5fa">⚡</text>
    <text x="52" y="28" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Treasury Policy Guardrails</text>
    <text x="52" y="42" font-family="-apple-system, sans-serif" font-weight="400" font-size="10" fill="#64748b">Liquidity buffer maintained 100%</text>
    <rect x="26" y="60" width="238" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)" />
    <rect x="26" y="60" width="195" height="6" rx="3" fill="url(#primaryGrad)" />
    <text x="26" y="80" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Buffer: $4.2M / $5.0M Cap</text>
    <text x="260" y="80" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" fill="#38bdf8" text-anchor="end">Policy Active</text>
  </g>

  <!-- FOREGROUND TEXT (Always crisp, prominent, unobstructed) -->
  <g transform="translate(60, 65)">
    <!-- Category Pill Badge -->
    <g class="floating-pill">
      <rect width="245" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10b981" />
      <text x="30" y="18" class="badge-text">TREASURY &amp; YIELD AUTOMATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" class="title">Corporate Treasury</text>
    <text x="0" y="128" class="title" fill="url(#primaryGrad)">Yield Optimization</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Curated SaaS platforms, AI liquidity engines &amp; open-source projects</text>
    <text x="0" y="196" class="subtitle" fill="#64748b">Cash positioning, deterministic idle balance sweeping &amp; working capital</text>

    <!-- Tags Row -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="52" y="17" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#cbd5e1" text-anchor="middle">🏦 SaaS TMS</text>

      <rect x="115" y="0" width="115" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="172" y="17" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#cbd5e1" text-anchor="middle">⚡ Open-Source</text>

      <rect x="240" y="0" width="115" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="297" y="17" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#cbd5e1" text-anchor="middle">📈 Yield Sweeps</text>

      <rect x="365" y="0" width="100" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="415" y="17" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#cbd5e1" text-anchor="middle">🛡️ Guardrails</text>
    </g>
  </g>
</svg>
